# ─────────────────────────────────────────────
# BytePath Backend — Application Configuration
# ─────────────────────────────────────────────

spring.application.name=bytepath-backend
server.port=${PORT:8081}

# ── H2 In-Memory Database (development) ──────
spring.datasource.url=jdbc:h2:mem:bytepathdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accessible at http://localhost:8080/h2-console in dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ───────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT Configuration ─────────────────────────
# IMPORTANT: Replace this with a long, random secret in production!
jwt.secret=${JWT_SECRET:BytePathSuperSecretKeyForJWTSigningMustBeAtLeast256BitsLong2024!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ── Google OAuth ─────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.callback-url=${GOOGLE_CALLBACK_URL:http://localhost:8081/api/auth/google/callback}

# ── Admin seed ───────────────────────────────────
admin.email=${ADMIN_EMAIL:admin@bytepath.local}
admin.password=${ADMIN_PASSWORD:change-me-in-development}
admin.name=${ADMIN_NAME:System Administrator}

# ── Cors Origins (update for your deployed frontend URL) ──
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Springdoc / Swagger ───────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────
logging.level.com.bytepath=DEBUG
logging.level.org.springframework.security=WARN

# ── ByteAI RAG provider (server-side only) ─────
# Set these as environment variables; never expose the key through Vite.
rag.api.url=${RAG_API_URL:}
rag.api.key=${RAG_API_KEY:}
rag.api.auth-header=${RAG_API_AUTH_HEADER:Authorization}
rag.api.auth-prefix=${RAG_API_AUTH_PREFIX:Bearer }
